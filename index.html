 profit. This study does not infer a production schedule, critical path, or specific process dependency.",recommendedControls:["Safety-led resilience planning","OT change management","Recovery exercises"]},{id:"automation",title:"Public disclosure of automated and monitored processes",description:"RAM states that a large part of its processes is automated and monitored in real time through consoles and graphic panels, and that it pursues digital projects.",category:"Digital environment",evidenceType:"Verified public fact",sourceReferences:["ram-digital"],publicationDate:"Not stated by publisher",analyticalInterpretation:"This supports discussing IT/OT governance and operational technology security at a strategic level, without assuming a particular architecture or security weakness.",limitations:"The page does not disclose control-system vendors, network topology, remote access design, or cybersecurity controls.",recommendedControls:["OT asset inventory","Segmentation review","OT-aware monitoring"]},{id:"predictive-maintenance",title:"Predictive maintenance uses data and mathematical models",description:"The maintenance page describes predictive maintenance using collected data processed with mathematical models to support intervention before a failure.",category:"Digital environment",evidenceType:"Verified public fact",sourceReferences:["ram-maintenance"],publicationDate:"Not stated by publisher",analyticalInterpretation:"As with any data-supported industrial process, provenance, integrity, access governance, and change control are defensible areas for internal validation.",limitations:"No specific model, data flow, platform, or AI use is identified. The publication does not establish a data-integrity issue.",recommendedControls:["Data validation","Access governance","Audit trails"]},{id:"logistics",title:"Product movement involves marine and road logistics",description:"RAM describes product movement by sea and by road tanker, as well as a connection to a nearby power station.",category:"External ecosystem",evidenceType:"Verified public fact",sourceReferences:["ram-logistics"],publicationDate:"Not stated by publisher",analyticalInterpretation:"Logistics coordination can raise general questions about information integrity, partner access, and business continuity.",limitations:"No driver application, external portal, or technical integration was verified in this source review.",recommendedControls:["Third-party governance","Secure application lifecycle","Continuity exercises"]},{id:"cybersecurity-posture",title:"Cybersecurity control maturity is not publicly established here",description:"The reviewed public materials provide industrial and digital context but do not provide evidence sufficient to rate RAM’s cybersecurity control implementation.",category:"Research boundary",evidenceType:"Not assessed",sourceReferences:["ram-profile","ram-digital"],publicationDate:"Reviewed 04 Nov 2026",analyticalInterpretation:"This is a limit of the public-information method, not evidence that a control is absent or ineffective.",limitations:"No internal documents, authorized interviews, or technical validation were performed.",recommendedControls:["Authorized maturity assessment","Evidence-based control review"]}],k3=[{number:"01",title:"People and workforce",context:"RAM reports more than 600 employees and an average of 1,000 third-party workers. The company also describes personnel training in the context of workplace safety.",whyItMatters:"Large, changing workforces can make identity lifecycle, role-appropriate awareness, and incident reporting harder to coordinate.",impact:"A hypothetical loss of identity assurance could affect business processes and response coordination.",evidenceType:"Risk inference",unknown:"Cybersecurity training coverage, authentication controls, and workforce susceptibility are not known.",sourceReferences:["ram-profile","ram-digital"]},{number:"02",title:"Suppliers and external access",context:"RAM publicly describes third-party companies operating alongside its workforce and a safety commitment with suppliers.",whyItMatters:"External relationships can create access-governance and assurance requirements, even when no digital access method is publicly documented.",impact:"An unmanaged third-party dependency could complicate service continuity or incident containment.",evidenceType:"Risk inference",unknown:"Supplier identities, digital access paths, contracts, and security assessments were not investigated.",sourceReferences:["ram-profile","ram-digital"]},{number:"03",title:"Logistics and applications",context:"Public company material describes marine product movement and road tanker shipments.",whyItMatters:"Any future digital coordination service should be governed for identity, privacy, session security, and data integrity.",impact:"A hypothetical disruption could affect scheduling, information quality, or coordination.",evidenceType:"Risk inference",unknown:"No driver app, supplier portal, or logistics application was technically inspected or confirmed.",sourceReferences:["ram-logistics"]},{number:"04",title:"Industrial digitalization and OT",context:"RAM publicly states that many processes are automated and monitored in real time; NIST explains that OT has distinct reliability and safety requirements.",whyItMatters:"Security controls in OT require coordination with process safety, availability, and operational change management.",impact:"A hypothetical OT incident could affect continuity and, depending on circumstances, safety or the environment.",evidenceType:"Risk inference",unknown:"Asset inventory, segmentation, control systems, remote access, and monitoring are not known.",sourceReferences:["ram-digital","nist-ot"]},{number:"05",title:"Data integrity and analytics",context:"RAM describes data and mathematical models in predictive maintenance.",whyItMatters:"Decision-support data should have clear provenance, validation, access controls, and accountable change proce
